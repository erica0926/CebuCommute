<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
</head>
<body>
<h2>Register as a passenger:</h2>

<form method="POST">
    {% csrf_token %}

    <label>First name:</label> {{ form.first_name }}<br><br>
    <label>Last name:</label> {{ form.last_name }}<br><br>
    <label>Username:</label> {{ form.username }}<br><br>
    <label>Email:</label> {{ form.email }}<br><br>
    <label>Password:</label> {{ form.password }}<br><br>

    <label>User Type:</label> {{ form.user_type }}
    <br><br>

    <button type="submit">Submit</button>
</form>

{% if error %}
<p style="color: red;">{{ error }}</p>
{% endif %}
</body>
</html>
